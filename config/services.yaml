parameters:
  app.remember_me_lifetime: 2592000
  app.totp_challenge_ttl_seconds: '%env(int:APP_TOTP_CHALLENGE_TTL_SECONDS)%'
  app.invitation_token_ttl_seconds: '%env(int:APP_INVITATION_TOKEN_TTL_SECONDS)%'
  app.password_reset_token_ttl_seconds: '%env(int:APP_PASSWORD_RESET_TOKEN_TTL_SECONDS)%'
  app.totp_email_from: '%env(APP_TOTP_EMAIL_FROM)%'
  app.public_download_challenge_ttl_seconds: '%env(int:APP_PUBLIC_DOWNLOAD_CHALLENGE_TTL_SECONDS)%'
  app.public_download_challenge_cooldown_seconds: '%env(int:APP_PUBLIC_DOWNLOAD_CHALLENGE_COOLDOWN_SECONDS)%'
  app.public_download_challenge_max_resend_count: '%env(int:APP_PUBLIC_DOWNLOAD_CHALLENGE_MAX_RESEND_COUNT)%'
  app.file_encryption_key: '%env(APP_FILE_ENCRYPTION_KEY)%'
  app.supported_locales: ['fr', 'en', 'de', 'lt', 'no']
  app.default_locale: 'en'
  app.fallback_locale: 'fr'
  app.default_theme: 'light'
  app.fallback_theme: 'light'
  app.allowed_assignable_roles: ['ROLE_USER', 'ROLE_ADMIN', 'ROLE_SHARE', 'ROLE_SHARE_SEND', 'ROLE_SHARE_PUBLIC', 'ROLE_SHARE_FRIENDS']
  app.public_download_inline_max_bytes: 3145728
  app.public_download_ticket_ttl_seconds: 900
  app.public_folder_zip_max_total_bytes: 524288000
  app.public_folder_zip_max_file_count: 2000
  app.public_folder_zip_max_build_seconds: 120
  # Chunk upload: fast default 2 MiB; fallback 1 MiB after gateway timeout (EPIC-UP-504b).
  app.upload_chunk_bytes: 2097152
  app.upload_chunk_bytes_fallback: 1048576
  app.upload_chunk_bytes_min: 262144
  app.upload_chunk_time_budget_ms: 25000
  app.download_direct_max_bytes: '%env(int:APP_DOWNLOAD_DIRECT_MAX_BYTES)%'
  app.download_manager_ui_threshold_bytes: '%env(int:APP_DOWNLOAD_DIRECT_MAX_BYTES)%'
  app.download_token_ttl_seconds: 7200
  env(APP_DOWNLOAD_GRANT_TTL_SECONDS): '604800'
  env(APP_DOWNLOAD_ARCHIVE_TTL_SECONDS): '604800'
  env(APP_DOWNLOAD_ARCHIVE_MAX_TOTAL_BYTES): '0'
  env(APP_DOWNLOAD_ARCHIVE_MAX_ENTRIES): '10000'
  env(APP_DOWNLOAD_ARCHIVE_TICK_SECONDS): '20'
  env(APP_DOWNLOAD_LAZY_INDEX_MAX_BYTES): '1073741824'
  app.download_grant_ttl_seconds: '%env(int:APP_DOWNLOAD_GRANT_TTL_SECONDS)%'
  app.download_archive_ttl_seconds: '%env(int:APP_DOWNLOAD_ARCHIVE_TTL_SECONDS)%'
  app.download_archive_max_total_bytes: '%env(int:APP_DOWNLOAD_ARCHIVE_MAX_TOTAL_BYTES)%'
  app.download_archive_max_entries: '%env(int:APP_DOWNLOAD_ARCHIVE_MAX_ENTRIES)%'
  app.download_archive_tick_seconds: '%env(int:APP_DOWNLOAD_ARCHIVE_TICK_SECONDS)%'
  app.download_lazy_index_max_bytes: '%env(int:APP_DOWNLOAD_LAZY_INDEX_MAX_BYTES)%'
  app.version: ''
  app.site_title: 'StuWebStorage'
  app.antibot_threshold: 50
  app.storage_bot_attestation_ttl_seconds: 2700

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'

  App\Service\Auth\RememberMePolicyService:
    arguments:
      $lifetimeSeconds: '%app.remember_me_lifetime%'

  App\Service\Audit\DownloadDiagnosticLogger:
    arguments:
      $appSecret: '%kernel.secret%'

  App\Service\Auth\TotpChallengeService:
    arguments:
      $defaultTtlSeconds: '%app.totp_challenge_ttl_seconds%'
      $resendCooldownSeconds: '%app.public_download_challenge_cooldown_seconds%'
      $maxResendCount: '%app.public_download_challenge_max_resend_count%'

  App\Service\Auth\UserInvitationService:
    arguments:
      $tokenTtlSeconds: '%app.invitation_token_ttl_seconds%'
      $supportedLocales: '%app.supported_locales%'

  App\Service\Auth\UserPasswordResetService:
    arguments:
      $tokenTtlSeconds: '%app.password_reset_token_ttl_seconds%'
      $supportedLocales: '%app.supported_locales%'

  App\Service\Notification\InvitationEmailNotificationService:
    arguments:
      $supportedLocales: '%app.supported_locales%'
      $defaultLocale: '%app.default_locale%'
      $fallbackLocale: '%app.fallback_locale%'

  App\Service\Notification\PasswordResetEmailNotificationService:
    arguments:
      $supportedLocales: '%app.supported_locales%'

  App\Service\Site\SiteMailTemplateResolverService:
    arguments:
      $envFromEmail: '%app.totp_email_from%'
      $envToEmail: ''
      $supportedLocales: '%app.supported_locales%'
      $fallbackLocale: '%app.fallback_locale%'

  App\Service\Share\PublicDownloadTotpService:
    arguments:
      $challengeTtlSeconds: '%app.public_download_challenge_ttl_seconds%'
      $resendCooldownSeconds: '%app.public_download_challenge_cooldown_seconds%'
      $maxResendCount: '%app.public_download_challenge_max_resend_count%'

  App\Service\File\FileEncryptionService:
    arguments:
      $encryptionKey: '%app.file_encryption_key%'

  App\Service\Admin\UserHardDeleteVaultService:
    arguments:
      $vaultKey: '%app.file_encryption_key%'

  App\Controller\Admin\UserInvitationController:
    arguments:
      $adminInviteLimiter: '@limiter.admin_invite'
      $supportedLocales: '%app.supported_locales%'

  App\Controller\Admin\UserController:
    arguments:
      $supportedLocales: '%app.supported_locales%'

  App\Controller\InvitationActivationController:
    arguments:
      $inviteActivationLimiter: '@limiter.invite_activation'

  App\Controller\PasswordResetController:
    arguments:
      $passwordResetRequestLimiter: '@limiter.password_reset_request'
      $passwordResetCompleteLimiter: '@limiter.password_reset_complete'

  App\EventSubscriber\LocaleSubscriber:
    arguments:
      $supportedLocales: '%app.supported_locales%'
      $defaultLocale: '%app.default_locale%'
      $fallbackLocale: '%app.fallback_locale%'

  App\Controller\LocaleController:
    arguments:
      $supportedLocales: '%app.supported_locales%'

  App\Service\Locale\LocaleConfigurationService:
    arguments:
      $supportedLocales: '%app.supported_locales%'
      $defaultLocale: '%app.default_locale%'
      $projectDir: '%kernel.project_dir%'

  App\EventSubscriber\ThemeSubscriber:
    arguments:
      $defaultTheme: '%app.default_theme%'
      $fallbackTheme: '%app.fallback_theme%'

  App\Service\Admin\RoleGovernanceService:
    arguments:
      $allowedRoles: '%app.allowed_assignable_roles%'

  App\Service\File\FilesStorageFeatureService:
    arguments:
      $enabled: '%app.files_storage_enabled%'

  App\Service\File\UserStorageQuotaService:
    arguments:
      $defaultQuotaBytes: '%app.user_storage_quota_bytes%'

  App\Controller\Admin\SettingsController:
    arguments:
      $defaultQuotaBytes: '%app.user_storage_quota_bytes%'

  App\Service\Admin\ServerDiskSpaceService:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Controller\FilesController:
    arguments:
      $projectDir: '%kernel.project_dir%'
      $downloadDirectMaxBytes: '%app.download_direct_max_bytes%'
      $downloadManagerUiThresholdBytes: '%app.download_manager_ui_threshold_bytes%'

  App\Service\Audit\UploadDiagnosticLogger:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Service\File\ChunkedUploadService:
    arguments:
      $chunkBytesDefault: '%app.upload_chunk_bytes%'
      $chunkBytesFallback: '%app.upload_chunk_bytes_fallback%'
      $chunkBytesMin: '%app.upload_chunk_bytes_min%'
      $chunkTimeBudgetMs: '%app.upload_chunk_time_budget_ms%'
      $projectDir: '%kernel.project_dir%'

  App\Service\File\UploadEncryptJobService:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Service\Download\DownloadGrantService:
    arguments:
      $appSecret: '%kernel.secret%'
      $ttlSeconds: '%app.download_grant_ttl_seconds%'

  App\Service\Download\EncryptedRangeReader:
    arguments:
      $lazyIndexMaxBytes: '%app.download_lazy_index_max_bytes%'

  App\Service\Download\DownloadArchiveService:
    arguments:
      $archiveTtlSeconds: '%app.download_archive_ttl_seconds%'
      $maxTotalBytes: '%app.download_archive_max_total_bytes%'
      $maxEntries: '%app.download_archive_max_entries%'
      $tickSeconds: '%app.download_archive_tick_seconds%'

  App\Controller\PublicDownloadController:
    arguments:
      $publicDownloadTicketCache: '@cache.app'
      $publicDownloadInlineMaxBytes: '%app.public_download_inline_max_bytes%'
      $publicDownloadTicketTtlSeconds: '%app.download_grant_ttl_seconds%'
      $downloadDirectMaxBytes: '%app.download_direct_max_bytes%'
      $downloadManagerUiThresholdBytes: '%app.download_manager_ui_threshold_bytes%'

  App\Controller\PublicFileLandingController:
    arguments:
      $downloadManagerUiThresholdBytes: '%app.download_manager_ui_threshold_bytes%'

  App\Service\Share\PublicSharePasswordVault:
    arguments:
      $secretMaterial: '%kernel.secret%'

  App\Service\Share\PublicSharePreAuthTokenService:
    arguments:
      $signingSecret: '%kernel.secret%'
      $ttlSeconds: 900

  App\Service\Share\PublicSharePasswordRateLimiterService:
    arguments:
      $cache: '@cache.app'

  App\Service\Share\PublicFolderZipService:
    arguments:
      $maxTotalBytes: '%app.public_folder_zip_max_total_bytes%'
      $maxFileCount: '%app.public_folder_zip_max_file_count%'
      $maxBuildSeconds: '%app.public_folder_zip_max_build_seconds%'

  App\Service\File\ZipExtractService:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Service\File\ZipExtractLimitsResolver:
    arguments:
      $maxTotalBytes: '%app.zip_extract_max_total_bytes%'
      $adminMaxTotalBytes: '%app.zip_extract_admin_max_total_bytes%'
      $maxFileCount: '%app.zip_extract_max_file_count%'
      $adminMaxFileCount: '%app.zip_extract_admin_max_file_count%'
      $maxSeconds: '%app.zip_extract_max_seconds%'
      $adminMaxSeconds: '%app.zip_extract_admin_max_seconds%'
      $batchSize: '%app.zip_extract_batch_size%'
      $maxCompressionRatio: '%app.zip_extract_max_compression_ratio%'

  App\Controller\BugReportController:
    arguments:
      $appVersion: '%app.version%'

  App\Service\Site\SiteAccessGateService:
    arguments:
      $defaultAntibotThreshold: '%app.antibot_threshold%'

  App\Service\Security\StorageBotAttestationService:
    arguments:
      $secret: '%kernel.secret%'
      $ttlSeconds: '%app.storage_bot_attestation_ttl_seconds%'

  App\File\FileIconMappingProvider:
    arguments:
      $mappingsDir: '%kernel.project_dir%/config/icons/mappings'
      $categoriesFile: '%kernel.project_dir%/config/icons/categories.yaml'

  App\File\FileExtensionIconResolver:
    arguments:
      $mappingProvider: '@App\File\FileIconMappingProvider'

  App\Twig\StorageSiteExtension:
    arguments:
      $siteTitle: '%app.site_title%'
      $siteAccessGateService: '@App\Service\Site\SiteAccessGateService'

  App\Service\BugReport\BugReportScreenshotStorage:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Monolog\RequestContextProcessor:
    tags:
      - { name: monolog.processor }
