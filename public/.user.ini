; PHP-FPM / CGI (shared hosting): per-request limits for chunked uploads (~2 MB chunks).
; Total file size is assembled server-side and is not limited by these values.
; Keep encrypt ticks short in app code so reverse proxies do not return HTTP 504.
upload_max_filesize = 32M
post_max_size = 36M
max_execution_time = 14400
max_input_time = 14400
memory_limit = 1024M
